name: invoice-audit

x-api-env: &api-env
  ENV: local
  AUTH_DISABLED: ${AUTH_DISABLED:-true}
  DATABASE_URL: postgresql+psycopg://audit:audit@db:5432/audit
  REDIS_URL: redis://redis:6379/0
  STORAGE_BACKEND: postgres   # uploaded files live in Postgres locally; production uses S3 (docker-compose.prod.yml)
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  AI_PROVIDER: ${AI_PROVIDER:-openai}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o}
  FAKE_PROVIDER_DEMO: ${FAKE_PROVIDER_DEMO:-}
  AI_ZDR_CONFIRMED: ${AI_ZDR_CONFIRMED:-false}
  CONFIDENCE_THRESHOLD: ${CONFIDENCE_THRESHOLD:-0.80}
  AI_ENABLED: ${AI_ENABLED:-true}
  AI_ZERO_RETENTION_REQUIRED: ${AI_ZERO_RETENTION_REQUIRED:-true}
  PRICE_INPUT_PER_MTOK: ${PRICE_INPUT_PER_MTOK:-2.5}
  PRICE_OUTPUT_PER_MTOK: ${PRICE_OUTPUT_PER_MTOK:-10}
  RAW_FILE_RETENTION_DAYS: ${RAW_FILE_RETENTION_DAYS:-90}
  INBOUND_EMAIL_SECRET: ${INBOUND_EMAIL_SECRET:-local-inbound-secret}
  AI_REDACT_BEFORE_SEND: ${AI_REDACT_BEFORE_SEND:-false}
  CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-sonnet-5-5}
  EXTRACTION_RETRIES: ${EXTRACTION_RETRIES:-1}
  JWT_SECRET: ${JWT_SECRET:-local-dev-jwt-secret-change-me-0123456789}
  DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:-}
  PUBLIC_BASE_URL: http://localhost:3000

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: audit
      POSTGRES_PASSWORD: audit
      POSTGRES_DB: audit
    ports: ["127.0.0.1:5433:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audit"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6380:6379"]

  api:
    build: ./api
    environment: *api-env
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
    command: sh -c "alembic upgrade head && python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports: ["127.0.0.1:8000:8000"]
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8000/health"]
      interval: 5s
      retries: 30

  worker:
    build: ./api
    environment: *api-env
    depends_on:
      api: { condition: service_healthy }
    command: rq worker --url redis://redis:6379/0 extraction flags reports maintenance

  maintenance:
    build: ./api
    environment: *api-env
    depends_on:
      api: { condition: service_healthy }
    command: python -m app.maintenance --loop

  web:
    build: ./web
    environment:
      API_URL: http://api:8000
    depends_on:
      api: { condition: service_healthy }
    ports: ["127.0.0.1:3000:3000"]

volumes:
  pgdata:
