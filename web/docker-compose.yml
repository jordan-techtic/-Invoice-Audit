# Frontend only. It needs a reachable backend at API_URL (default: the `api` service from api/docker-compose.yml,
# which joins the shared `invoice-audit` network). Run from this folder:
#     (cd ../api && make up)  then  make up
# Next.js bakes the /api rewrite at build time, so changing API_URL needs a rebuild:
#     API_URL=http://other-host:8000 docker compose up -d --build
name: invoice-audit-web

services:
  web:
    build:
      context: .
      args:
        API_URL: ${API_URL:-http://api:8000}
    environment:
      API_URL: ${API_URL:-http://api:8000}
    ports: ["127.0.0.1:3000:3000"]
    networks: [audit]

networks:
  audit:
    name: invoice-audit
    external: true
