# Production overrides:  docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# Adds TLS (Caddy gets and renews a certificate automatically), turns off published DB/Redis ports, and sets the
# settings that `make config-check` lists. NOT exercised in this prototype's test environment.
x-prod-env: &prod-env
  ENV: production
  STORAGE_BACKEND: s3
  COOKIE_SECURE: "true"
  PUBLIC_BASE_URL: https://${DOMAIN:?set DOMAIN}
  S3_ENDPOINT_URL: ""            # use real AWS S3, US region, with default bucket encryption
  S3_REGION: us-east-1
  S3_SSE: AES256
  S3_BUCKET: ${S3_BUCKET:?set S3_BUCKET}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:?}
  S3_SECRET_KEY: ${S3_SECRET_KEY:?}
  JWT_SECRET: ${JWT_SECRET:?}
  DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?}
  INBOUND_EMAIL_SECRET: ${INBOUND_EMAIL_SECRET:?}
  OPENAI_API_KEY: ${OPENAI_API_KEY:?}
  AI_ZDR_CONFIRMED: ${AI_ZDR_CONFIRMED:?confirm zero data retention first}

services:
  caddy:
    image: caddy:2
    ports: ["80:80", "443:443"]
    environment: { DOMAIN: "${DOMAIN}" }
    volumes: ["./infra/Caddyfile:/etc/caddy/Caddyfile:ro", "caddy_data:/data"]
    depends_on: [web, api]
  api:
    environment: *prod-env
    ports: !reset []
    depends_on: !override               # production uses AWS S3, so the local MinIO is not started
      db: { condition: service_healthy }
      redis: { condition: service_started }
  worker: { environment: *prod-env }
  maintenance: { environment: *prod-env }
  web: { ports: !reset [] }
  db: { ports: !reset [] }
  redis: { ports: !reset [] }

volumes:
  caddy_data:
